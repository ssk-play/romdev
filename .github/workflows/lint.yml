name: lint

# Static-analysis gate over romdev's own JavaScript. The full test suite -
# including the core-booting, ROM-building parts - runs in test.yml, which
# fills the gitignored wasm payloads from the published npm tarballs. Lint
# stays its own fast job so a style break is visible in seconds, not after a
# 450MB payload fetch.
#
# This fork lints only the JavaScript it changes relative to upstream
# (monteslu/romdev main, from the merge base). Errors in upstream's own files
# are upstream's to fix; fixing them here would spread the fork's diff over
# files it does not otherwise touch and conflict on every upstream merge.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the merge base with upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # repo engines floor is >=24
          cache: npm

      - name: Check workspace pins
        run: node scripts/check-pins.mjs

      # --ignore-scripts skips romdevtools' postinstall (it expects bundled wasm,
      # absent in CI). We DO install workspace deps (not --workspaces=false) so
      # the pure-JS tests get romdevtools' runtime deps (zod, pngjs). The core/
      # toolchain packages resolve from npm but stay light here - their wasm only
      # arrives via the skipped postinstall, which the pure-JS tests don't need.
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: ESLint (files this fork changes)
        run: |
          git fetch --no-tags https://github.com/monteslu/romdev.git main
          base=$(git merge-base HEAD FETCH_HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.js' '*.mjs' '*.cjs')
          echo "linting ${#files[@]} file(s) changed since $(git rev-parse --short "$base")"
          if [ ${#files[@]} -gt 0 ]; then npx eslint --no-warn-ignored "${files[@]}"; fi
